[package]
name = "axiom-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "axiom"
path = "src/main.rs"

[dependencies]
axiom-application = { path = "../axiom-application" }
axiom-ami = { path = "../axiom-ami" }
axiom-parser = { path = "../axiom-parser" }
axiom-project = { path = "../axiom-project" }
axiom-synth = { path = "../axiom-synth" }
axiom-verify = { path = "../axiom-verify" }
axiom-wasm = { path = "../axiom-wasm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
