[workspace]
resolver = "2"
members = [
    "crates/axiom-ami",
    "crates/axiom-parser",
    "crates/axiom-verify",
    "crates/axiom-synth",
    "crates/axiom-wasm",
    "crates/axiom-project",
    "crates/axiom-application",
    "crates/axiom-cli",
]

# Synthesis and verification tests are CPU-bound; unoptimized builds make them slow and flaky.
[profile.test]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
