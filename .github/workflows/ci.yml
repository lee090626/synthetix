name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # z3-sys downloads Z3's release through the GitHub API; a token avoids the
  # shared runner IP's anonymous rate limit.
  READ_ONLY_GITHUB_TOKEN: ${{ github.token }}

jobs:
  test:
    name: fmt + workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # One copy on the default branch, which every branch and PR can read;
          # per-branch copies pushed the repository past its 10GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run --locked --workspace
      - name: Run doctests
        run: cargo test --locked --workspace --doc

  lean:
    name: lean proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check Lean proofs
        working-directory: proofs/lean
        run: |
          lean Settle.lean
          lean Lists.lean
          for f in generated/*.lean; do lean "$f"; done
          ! grep -rn "sorry" --include="*.lean" .
