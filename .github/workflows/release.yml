name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: cargo test --locked --workspace

  build-cli:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
    steps:
      - uses: actions/checkout@v4
      - name: Initialize native CLI evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-cli-evidence"
          {
            echo "# Native CLI verification"
            echo
            echo "- Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo "- Target: ${{ matrix.target }}"
            echo "- Platform: ${{ matrix.platform }}"
          } > "$RUNNER_TEMP/native-cli-evidence/summary.md"
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-
      - name: Build release CLI
        id: build_cli
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --locked --release -p axiom-cli --target ${{ matrix.target }}
      - name: Smoke test native release CLI
        id: smoke_cli
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cli="$(pwd -P)/target/${{ matrix.target }}/release/axiom.exe"
          else
            cli="$(pwd -P)/target/${{ matrix.target }}/release/axiom"
          fi
          evidence="$RUNNER_TEMP/native-cli-evidence"

          "$cli" check examples/basics/mul8.ax > "$evidence/check.log" 2>&1
          grep -F "contract_check: VALID" "$evidence/check.log"
          printf '\n- Check representative .ax: PASS\n' >> "$evidence/summary.md"

          "$cli" build examples/basics/mul8.ax \
            -o "$evidence/mul8-build.wasm" \
            --report "$evidence/mul8-build.json" \
            > "$evidence/build.log" 2>&1
          test -s "$evidence/mul8-build.wasm"
          node -e 'const fs = require("node:fs"); const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (r.proof_result !== "VERIFIED" || !r.wasm_hash || !r.output) process.exit(1);' \
            "$evidence/mul8-build.json"
          printf '%s\n' "- Build verified .ax and emitted WASM: PASS" >> "$evidence/summary.md"

          mul8_output=$("$cli" run examples/basics/mul8.ax -- 5 -o "$evidence/mul8-run.wasm" 2>&1)
          [[ "$mul8_output" == *"result: 40"* ]]
          test -s "$evidence/mul8-run.wasm"
          printf '%s\n' "- mul8(5) = 40: PASS" >> "$evidence/summary.md"

          signed_output=$("$cli" run examples/basics/signed_min.ax -- -1 1 -o "$evidence/signed-min.wasm" 2>&1)
          [[ "$signed_output" == *"result: -1"* ]]
          test -s "$evidence/signed-min.wasm"
          printf '%s\n' "- signed_min(-1, 1) = -1: PASS" >> "$evidence/summary.md"

          for fixture_case in \
            "UNSATISFIABLE_PRECONDITION:examples/errors/unsat_precondition.ax" \
            "UNSATISFIABLE_POSTCONDITION:examples/errors/unsat_postcondition.ax"; do
            expected="${fixture_case%%:*}"
            fixture="${fixture_case#*:}"
            name="$(basename "$fixture" .ax)"
            check_log="$evidence/$name-check.log"
            if "$cli" check "$fixture" > "$check_log" 2>&1; then
              cat "$check_log"
              echo "expected $expected from $fixture check"
              exit 1
            else
              status=$?
            fi
            [[ "$status" -eq 1 ]]
            grep -F "$expected" "$check_log"

            wasm="$evidence/$name.wasm"
            report="$evidence/$name.json"
            build_log="$evidence/$name-build.log"
            if "$cli" build "$fixture" -o "$wasm" --report "$report" > "$build_log" 2>&1; then
              cat "$build_log"
              echo "expected $expected from $fixture build"
              exit 1
            else
              status=$?
            fi
            [[ "$status" -eq 1 ]]
            grep -F "$expected" "$build_log"
            test -s "$report"
            node -e 'const fs = require("node:fs"); const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (r.contract_check !== process.argv[2] || r.wasm_hash !== null || r.output !== null) process.exit(1);' \
              "$report" "$expected"
            [[ ! -e "$wasm" ]]
            printf '%s\n' "- $fixture returns $expected (exit 1; no WASM): PASS" >> "$evidence/summary.md"
          done

          v6_root="$evidence/v6-release-project"
          cp -R examples/v6-release "$v6_root"
          (
            cd "$v6_root"
            "$cli" check > "$evidence/v6-check.log" 2>&1
            "$cli" build > "$evidence/v6-build.log" 2>&1
          )
          node scripts/v6-release-smoke.cjs "$v6_root/dist" \
            > "$evidence/v6-release-smoke.log" 2>&1
          cat "$evidence/v6-release-smoke.log"
          printf '%s\n' "- v6 array/loop/modular WASM and static effect smoke: PASS" >> "$evidence/summary.md"
      - name: Publish native CLI summary
        if: always()
        shell: bash
        run: |
          echo "- Release build step: ${{ steps.build_cli.outcome }}" >> "$RUNNER_TEMP/native-cli-evidence/summary.md"
          echo "- Smoke step: ${{ steps.smoke_cli.outcome }}" >> "$RUNNER_TEMP/native-cli-evidence/summary.md"
          cat "$RUNNER_TEMP/native-cli-evidence/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload native CLI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cli-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-cli-evidence/
          if-no-files-found: error
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/axiom release/axiom-${{ matrix.platform }}
          tar -C release -czf release/axiom-${{ matrix.platform }}.tar.gz axiom-${{ matrix.platform }}
          shasum -a 256 release/axiom-${{ matrix.platform }}.tar.gz > release/axiom-${{ matrix.platform }}.tar.gz.sha256
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/axiom.exe" "release/axiom-${{ matrix.platform }}.exe"
          Compress-Archive -Path "release/axiom-${{ matrix.platform }}.exe" -DestinationPath "release/axiom-${{ matrix.platform }}.zip"
          (Get-FileHash "release/axiom-${{ matrix.platform }}.zip" -Algorithm SHA256).Hash.ToLower() + "  axiom-${{ matrix.platform }}.zip" | Set-Content "release/axiom-${{ matrix.platform }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: release/*

  package-vsix:
    name: Package VSCode extension
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release-artifacts
          merge-multiple: true
      - name: Add bundled platform CLIs
        shell: bash
        run: |
          mkdir -p editors/vscode/bin/darwin-arm64 editors/vscode/bin/darwin-x64 editors/vscode/bin/linux-x64 editors/vscode/bin/win32-x64
          cp release-artifacts/axiom-darwin-arm64 editors/vscode/bin/darwin-arm64/axiom
          cp release-artifacts/axiom-darwin-x64 editors/vscode/bin/darwin-x64/axiom
          cp release-artifacts/axiom-linux-x64 editors/vscode/bin/linux-x64/axiom
          cp release-artifacts/axiom-win32-x64.exe editors/vscode/bin/win32-x64/axiom.exe
          chmod +x editors/vscode/bin/darwin-arm64/axiom editors/vscode/bin/darwin-x64/axiom editors/vscode/bin/linux-x64/axiom
      - name: Package VSIX
        working-directory: editors/vscode
        shell: bash
        run: |
          mkdir -p ../../release
          version=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce package --out "../../release/synthetix-vscode-${version}.vsix"
          node ./check-vsix.js "../../release/synthetix-vscode-${version}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetix-vscode
          path: release/*.vsix

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build-cli, package-vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Synthetix $GITHUB_REF_NAME" \
            --generate-notes
